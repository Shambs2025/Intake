<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Request Submission</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-container">
        <h2>Submit Your Event Request</h2>
        <form id="eventRequestForm">
            <div class="form-group">
                <label for="requesterName">Your Full Name:</label>
                <input type="text" id="requesterName" name="requesterName" required>
            </div>
            <div class="form-group">
                <label for="requesterEmail">Your Email:</label>
                <input type="email" id="requesterEmail" name="requesterEmail" required>
            </div>

            <div class="form-group">
                <label for="eventName">Event Name/Title:</label>
                <input type="text" id="eventName" name="eventName" required>
            </div>
            <div class="form-group">
                <label for="eventType">Event Type:</label>
                <select id="eventType" name="eventType" required>
                    <option value="">Select a type...</option>
                    <option value="webinar">Webinar/Online</option>
                    <option value="conference">Conference/Seminar</option>
                    <option value="internal">Internal Meeting</option>
                    <option value="social">Social/Party</option>
                </select>
            </div>
            <div class="form-group">
                <label for="eventDate">Requested Date:</label>
                <input type="date" id="eventDate" name="eventDate" required>
            </div>
            <div class="form-group">
                <label for="eventTime">Approximate Time (Start - End):</label>
                <input type="text" id="eventTime" name="eventTime" placeholder="e.g., 2:00 PM - 4:00 PM">
            </div>
            <div class="form-group">
                <label for="attendance">Estimated Attendance:</label>
                <input type="number" id="attendance" name="attendance" min="1" required>
            </div>
            <div class="form-group">
                <label for="description">Detailed Description & Needs:</label>
                <textarea id="description" name="description" rows="5" required></textarea>
            </div>
            
            <button type="submit" id="submitBtn">Submit Request</button>
            <p id="message" class="hidden"></p>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
